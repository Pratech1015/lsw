# lsw - LSW configuration
# Located at /etc/lsw/lsw.conf

# Default Windows version to use when none is specified
# Options: windows-11, windows-10
default_distro="windows-11"

# LSW data directory
# lsw_data_dir="/var/lib/lsw"

# Whether to run the daemon in the background
# daemon_enabled="true"

# Windows compatibility mode
# Options: high, medium, low
# compat_mode="high"

# Enable GPU acceleration for Windows apps (requires graphics drivers)
# gpu_acceleration="true"

# Enable audio (requires PulseAudio or PipeWire)
# audio="true"

# Logging level: 0=info, 1=warn, 2=error, 3=debug
# log_level="1"